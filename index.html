<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root {
  --bg-primary:    #ffffff;
  --bg-secondary:  #f5f5f7;
  --bg-tertiary:   #fbfbfd;
  --bg-grouped:    #f2f2f7;
  --bg-elevated:   #ffffff;
  --text-primary:   #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary:  #aeaeb2;
  --accent:        #0071e3;
  --tint-red:    #ff3b30;
  --tint-orange: #ff9500;
  --tint-green:  #34c759;
  --tint-blue:   #007aff;
  --tint-purple: #af52de;
  --separator:  rgba(60, 60, 67, .12);
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 14px rgba(0,0,0,.08);
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  line-height: 1.47059;
  letter-spacing: -0.022em;
}
#map { width: 100%; height: 38vh; min-height: 260px; position: sticky; top: 0; z-index: 100; }
.tabs {
  display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto;
  background: rgba(255,255,255,.85); -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px); position: sticky; top: 38vh; z-index: 99;
  border-bottom: .5px solid var(--separator); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 6px 14px; border-radius: 980px; border: none;
  background: var(--bg-grouped); color: var(--text-secondary);
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.tab.active { background: var(--accent); color: #fff; }
.content { max-width: 700px; margin: 0 auto; padding: 12px 14px calc(20px + var(--safe-bottom)); }
.hero { text-align: center; padding: 20px 16px 14px; }
.hero h1 { font-size: 24px; font-weight: 700; }
.hero .subtitle { font-size: 15px; color: var(--text-secondary); margin-top: 4px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.info-card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-sm); }
.info-card .label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 4px; }
.info-card .value { font-size: 14px; font-weight: 600; }
.section-head { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; padding: 16px 0 6px; }
.day-head { padding: 16px 0 10px; }
.day-head h2 { font-size: 20px; font-weight: 700; }
.day-head p { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }
.route-bar {
  background: var(--bg-elevated); border-radius: var(--radius-md); padding: 10px 12px;
  margin-bottom: 12px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.65; white-space: pre-line;
}
.route-bar strong { color: var(--text-primary); }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 18px; bottom: 18px; width: 1.5px; background: var(--separator); }
.tl-item { position: relative; margin-bottom: 8px; }
.tl-dot { position: absolute; left: -18px; top: 16px; width: 9px; height: 9px; border-radius: 50%; z-index: 1; box-shadow: 0 0 0 3px var(--bg-secondary); }
.tl-dot.food    { background: var(--tint-red); }
.tl-dot.spot    { background: var(--tint-blue); }
.tl-dot.hotel   { background: var(--tint-orange); }
.tl-dot.drink   { background: var(--tint-purple); }
.tl-dot.transport { background: var(--text-tertiary); }
.card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 12px 14px; box-shadow: var(--shadow-sm); cursor: pointer; }
.card .time { font-size: 11px; font-weight: 600; color: var(--text-tertiary); }
.card .name { font-size: 15px; font-weight: 600; margin: 2px 0 3px; display: flex; align-items: center; gap: 5px; }
.card .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
.badge { display: inline-flex; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.badge.food   { background: rgba(255,59,48,.1);  color: var(--tint-red); }
.badge.spot   { background: rgba(0,122,255,.1);  color: var(--tint-blue); }
.badge.drink  { background: rgba(175,82,222,.1); color: var(--tint-purple); }
.details {
  margin-top: 8px; padding-top: 8px;
  border-top: .5px solid var(--separator);
  font-size: 12.5px; color: var(--text-secondary); line-height: 1.55;
}
.details.closed { display: none; }
.day-list .card { margin-bottom: 6px; }
.day-list .card .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 6px 0; font-size: 11px; color: var(--text-secondary); }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }
.leaflet-popup-content-wrapper { border-radius: var(--radius-md) !important; font-family: -apple-system, sans-serif !important; }
.leaflet-popup-content { font-size: 13px !important; margin: 10px 12px !important; }
</style>
</head>

const map = L.map('map', { center: [43.0, 11.5], zoom: 6, zoomControl: false, attributionControl: true });
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

function icon(color, emoji) {
  return L.divIcon({ className: '', html: `<div style="width:26px;height:26px;border-radius:50%;background:${color};border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.16)">${emoji||''}</div>`, iconSize: [26,26], iconAnchor: [13,13], popupAnchor: [0,-14] });
}

let markers = [], polylines = [];
const emojis = { food:'🍽️', spot:'📍', hotel:'🏨', transport:'🚃', drink:'🍺' };

function clearMap() { markers.forEach(m=>map.removeLayer(m)); polylines.forEach(p=>map.removeLayer(p)); markers=[]; polylines=[]; }

function showDay(idx) {
  clearMap();
  if (idx === 0) {
    const pts = [];
    DAYS.forEach(d => d.locations.forEach(l => { if(l.lat) pts.push([l.lat,l.lng]); }));
    if(pts.length) map.fitBounds(pts, {padding:[35,35]});
    DAYS.slice(1).forEach(d => {
      d.locations.filter(l=>l.time!=='—').forEach(l => {
        const m = L.circleMarker([l.lat,l.lng], { radius:3.5, fillColor:d.color, color:'#fff', weight:1.5, fillOpacity:.9 }).addTo(map).bindPopup(`<b>${l.name}</b><br><span style="color:#86868b">${d.label}</span>`);
        markers.push(m);
      });
    });
    return;
  }
  const day = DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords = [];
  day.locations.forEach(l => {
    if(!l.lat) return;
    const m = L.marker([l.lat,l.lng], { icon: icon(day.color, emojis[l.type]||'📌') }).addTo(map);
    m.bindPopup(`<b>${l.name}</b>${l.time!=='—'?'<br><span style="color:#86868b">'+l.time+'</span>':''}<br>${l.desc.substring(0,100)}`);
    markers.push(m);
    if(l.time!=='—') coords.push([l.lat,l.lng]);
  });
  if(coords.length>1) { const pl = L.polyline(coords, { color:day.color, weight:2, opacity:.4, dashArray:'6,5' }).addTo(map); polylines.push(pl); }
  if(coords.length) map.fitBounds(coords, { padding:[35,35], maxZoom:12 });
}

function toggle(id) { const el=document.getElementById(id); if(el) el.classList.toggle('closed'); }

function locCard(loc, dayIdx) {
  const dot = loc.type==='food'?'food':loc.type==='spot'?'spot':loc.type==='drink'?'drink':loc.type==='hotel'?'hotel':'transport';
  const bdg = loc.type==='food'?'<span class="badge food">餐</span>':loc.type==='spot'?'<span class="badge spot">景</span>':loc.type==='drink'?'<span class="badge drink">饮</span>':'';
  const uid = `d${dayIdx}-${loc.name.replace(/\W/g,'')}`;
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="toggle('${uid}')"><div class="time">${loc.time}</div><div class="name">${bdg} ${loc.name}</div><div class="desc">${loc.desc}</div>${loc.detail?'<div class="details" id="'+uid+'">'+loc.detail.replace(/\n/g,'<br>')+'</div>':''}</div></div>`;
}

function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  if(main.length) { h += '<div class="section-head">行程</div><div class="timeline">'; main.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  if(alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  return h;
}

</div>`;
}

let cur = 0;
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

DAYS.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (d.id===0?' active':'');
  btn.dataset.day = d.id;
  btn.textContent = d.label;
  tabsEl.appendChild(btn);
});

function go(idx) {
  cur = idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day===idx));
  contentEl.innerHTML = idx===0 ? overviewContent() : renderDay(idx);
  showDay(idx);
  window.scrollTo({top:0});
}

tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });
go(0);
</script>
