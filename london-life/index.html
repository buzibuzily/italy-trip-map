const scenes=[{"ch": "00", "nav": "初到英国", "tag": "2025 · ARRIVAL", "title": "一个箱子，出发。", "desc": "抵达伦敦。先解决住哪儿、怎么去学校，剩下的以后再说。", "tip": "🧳 留个影：当时的行李还算克制。", "hero": "IMG_6406.JPG", "choices": [["看看抵英时的行李", "IMG_6406.JPG"], ["直接开始英国生活", "IMG_3492.jpg"]], "extra": []}, {"ch": "01", "nav": "上学之路", "tag": "A REGULAR MORNING", "title": "每天，先走半小时。", "desc": "相当于从玉湖走到基础图书馆。途中还要观察车流，顺便给自己买点上学动力。", "tip": "🚶 起床已是第一关，出门是第二关。", "hero": "IMG_1963.jpg", "choices": [["看看每天走过的街道", "EA5100F2-5A03-47CB-A8FF-8C182A95BE92.MOV"], ["走累了，买杯咖啡", "IMG_1963.jpg"], ["不想做饭，去找路边大叔", "IMG_4606.jpg"]], "extra": ["IMG_7769.jpg"]}, {"ch": "02", "nav": "UCL 学习", "tag": "UCL · WEEKDAYS", "title": "好了，真的要学习了。", "desc": "在 UCL 工位读文献、写论文，每周和外导见面讨论。中午带饭到学院的公共厨房吃。", "tip": "📚 认真上学这部分，有图有真相。", "hero": "IMG_4692.jpg", "choices": [["进入学院", "IMG_3492.jpg"], ["看看和外导的合照（Live）", "D2123E11-7E35-4CC6-9A1C-425803222320.MOV"], ["我的午饭地点", "IMG_4617.jpg"], ["看看工位窗外", "09081ADB-6D5F-41C8-B31D-BAC22FC54CBD.MOV"], ["听听晚上楼下的琴声", "IMG_9800.MOV"]], "extra": ["IMG_2283.jpg"]}, {"ch": "03", "nav": "吃喝续命", "tag": "LONDON · FOOD & DRINKS", "title": "没有奶茶，怎么写论文？", "desc": "咖啡、奶茶、甜点轮番上阵。英国的奶油顶尤其不客气，甜到我回来还惦记牙齿。", "tip": "🧋 一杯不够，那就两杯。", "hero": "IMG_2020.jpg", "choices": [["我的奶茶日常", "IMG_2020.jpg"], ["今天换抹茶", "IMG_1960.jpg"], ["感受一下英国甜度", "IMG_7771.jpg"], ["看看传说中的奶油顶", "IMG_9780.jpg"]], "extra": ["IMG_6763.jpg", "IMG_2105.jpg"]}, {"ch": "04", "nav": "自己做饭", "tag": "LONDON · HOME", "title": "谁说南方人不会做包子？", "desc": "不想做饭就买饼；想做饭时，包子、火锅和给室友做的生日蛋糕也能安排。", "tip": "🥟 南方人意外点亮面食技能树。", "hero": "IMG_6803.jpg", "choices": [["看看我包包子的现场", "IMG_7950.MOV"], ["晚上和室友吃火锅", "53a7234d25f03fca38d0f1b71d20fe65_livephoto.jpg"], ["给室友做的生日蛋糕", "IMG_6803.jpg"]], "extra": ["IMG_2098.jpg"]}, {"ch": "05", "nav": "伦敦散步", "tag": "LONDON · WEEKEND", "title": "下班之后，伦敦还有节目。", "desc": "街头的音乐、节日天使灯、英超现场。偶尔同学来访，就一起在城里逛逛。", "tip": "🎧 有时候，声音比照片更有记忆点。", "hero": "IMG_6711.JPG", "choices": [["看看英国的风景混剪", "copy_99FFD358-C7CA-425F-9F3D-4636BCCFDF81.MP4"], ["伦敦交通里的街头演奏", "IMG_0171.mov"], ["看切尔西对伯恩利", "716C9486-385F-435E-96F1-ACB58A3CD43E.MOV"], ["同学来找我玩", "81b278160b2e3d688108eebf78b0e9b8.JPG"]], "extra": ["E25DD2D2-901E-41FE-8718-7FF8575C9112.MOV"]}, {"ch": "06", "nav": "苏格兰", "tag": "SCOTLAND · EDINBURGH", "title": "离开英格兰，画风变了。", "desc": "爱丁堡的石头建筑和城市风景很惊艳。还听到街头表演，并解锁了苏格兰蛋。", "tip": "🥚 《饥荒》玩家：这不是高脚鸟蛋吗？", "hero": "IMG_8235.jpg", "choices": [["看看爱丁堡风景", "IMG_8235.jpg"], ["听听爱丁堡街头表演", "IMG_8322.mov"], ["苏格兰蛋本蛋", "IMG_8325.jpg"], ["我做的《饥荒》滤镜", "IMG_8346.JPG"]], "extra": []}, {"ch": "07", "nav": "洛杉矶", "tag": "LOS ANGELES · AERA", "title": "先开会，然后去晒太阳。", "desc": "AERA 学术交流结束，去加州海岸吹风、看海、逛迪士尼。税是不是都收在阳光上了？", "tip": "🌞 伦敦的太阳：限量供应。加州：无限供应。", "hero": "IMG_9385.JPG", "choices": [["先证明我真的开了会", "IMG_9385.JPG"], ["加州海岸有多好看", "fxn 2026-04-10 194314.228.JPG"], ["看海鸥和海浪", "fxn 2026-04-10 120931.214.JPG"], ["迪士尼遇见米妮", "EE711F85-BE2D-47E7-A5E4-48B66B3CB429.MOV"]], "extra": ["fxn 2026-04-10 130310.322.JPG", "IMG_9423.MOV"]}, {"ch": "08", "nav": "欧洲旅行", "tag": "EUROPE · DETOURS", "title": "景点好看，插曲更好玩。", "desc": "比萨斜塔网红姿势没拍成，豆包 AI 帮忙起飞。再去罗马、卢浮宫，顺路尝尝西班牙冰淇淋。", "tip": "✨ 网红照片：技术不够，AI 来凑。", "hero": "IMG_1373.JPG", "choices": [["看我的 AI 飞跃比萨斜塔", "IMG_1373.JPG"], ["历史课本和罗马斗兽场", "IMG_1432.jpg"], ["卢浮宫：蒙娜丽莎与围观群众", "IMG_2898.jpg"], ["西班牙冰淇淋", "IMG_1883.jpg"]], "extra": ["fxn 2026-07-25 2246587DA88368707F.JPG"]}, {"ch": "09", "nav": "回国", "tag": "2026 · HOME AGAIN", "title": "回来时，东西怎么变多了？", "desc": "刚到英国时一个箱子。回国的时候，行李和回忆都装得满满的。", "tip": "🧳 一年访学，存档成功。", "hero": "IMG_4724.JPG", "choices": [["回到最开始的行李", "IMG_6406.JPG"], ["再看回国时的行李", "IMG_4724.JPG"]], "extra": []}];

function tile(m){let b=document.createElement('button');b.className='tile';let img=document.createElement('img');img.src=display(m);img.loading='lazy';img.alt=m.title||m.file;let c=document.createElement('div');c.className='cap';let label=document.createElement('b');label.textContent=(m.type==='video'?'▶ ':'')+m.title;let sm=document.createElement('small');sm.textContent=m.note||'';c.append(label,sm);b.append(img,c);b.onclick=()=>openModal(m);return b}
function openModal(m){$('#modalbody').replaceChildren();let el=document.createElement(m.type==='video'?'video':'img');el.src=m.src;if(m.type==='video'){el.controls=true;el.playsInline=true;el.autoplay=true;el.poster=m.thumb||''}$('#modalbody').append(el);$('#modalcaption').textContent=m.title;$('#modal').classList.add('show')}

function go(i){idx=(i+scenes.length)%scenes.length;clearVideo();let s=scenes[idx];$('#chapterbadge').textContent=String(idx+1).padStart(2,'0')+' / '+scenes.length;$('#eyebrow').textContent=s.tag;$('#title').textContent=s.title;$('#desc').textContent=s.desc;$('#sticker').textContent=s.tip;$('#mediahint').textContent='点击选项，左边就会显示对应照片或播放视频。';showFile(s.hero);$('#mediahint').textContent='点击选项，左边就会显示对应照片或播放视频。';$('#choices').replaceChildren();for(const [label,filename] of s.choices){let b=document.createElement('button');b.className='choice';b.innerHTML='<span></span><span>↗</span>';b.firstChild.textContent=label;b.onclick=()=>showFile(filename);$('#choices').append(b)}let cards=s.extra.map(file).filter(Boolean);$('#cards').replaceChildren(...cards.map(tile));$('#cards').parentElement.classList.toggle('hidden',!cards.length);document.querySelectorAll('[data-scene]').forEach(el=>el.classList.toggle('active',Number(el.dataset.scene)===idx));$('#prev').disabled=idx===0;$('#next').textContent=idx===scenes.length-1?'从头再来 ↻':'下一幕 →';window.scrollTo({top:0,behavior:'smooth'})}
