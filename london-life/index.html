ient(0deg,#101f21b8 0%,transparent 55%)}.scene-art .artlabel{position:relative;padding:36px;color:#fff}.artlabel strong{display:block;font-size:26px;font-family:Georgia,"Songti SC",serif;margin:8px 0}.artlabel small{font-size:12px;opacity:.85;letter-spacing:.13em}.scene-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:38px;background:radial-gradient(circle at 35% 25%,#fff2ce,transparent 44%),radial-gradient(circle at 70% 75%,#b6d9d5,transparent 58%),linear-gradient(135deg,#efe6dd,#d5e8df)}.scene-placeholder .emoji{font-size:105px;filter:drop-shadow(0 18px 14px #415c5530)}.scene-placeholder .missing{font-size:11px;background:#ffffff94;border:1px dashed #becbc0;padding:9px 13px;border-radius:40px;margin-top:26px;color:#7c8a82}.scene-panel{display:flex;flex-direction:column;padding:45px clamp(24px,4.3vw,70px);gap:15px}.kicker{font-size:12px;font-weight:800;letter-spacing:.17em;color:#91a88a}.scene-panel h2{font-family:Georgia,"Songti SC","STSong",serif;font-size:clamp(28px,3vw,43px);font-weight:500;margin:0;line-height:1.45}.scene-panel p{font-size:15px;line-height:2.1;color:#7b8680}.quote{font-size:13px;line-height:1.9;background:#f5f7f0;border-left:3px solid #afcca7;padding:13px 17px;border-radius:0 12px 12px 0;color:#647368}.choices{display:grid;gap:11px;margin-top:15px}.choice{background:#fff;border:1px solid #e3e9df;border-radius:15px;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;text-align:left;color:#42514a;transition:.2s}.choice:hover{transform:translateX(4px);background:#f4f8ee;border-color:#a8c5a0}.choice span{color:#96a99c}.response{background:#f3f8ed;border:1px solid #cbdcbd;color:#50684e;padding:20px;border-radius:17px;line-height:1.9;font-size:14px}.back{border:0;background:transparent;color:#809185;font-size:12px;text-align:left;padding:13px 0;margin-top:auto}.tools{display:flex;gap:10px;flex-wrap:wrap}.pill{display:inline-block;background:#eef3e9;border-radius:30px;padding:9px 14px;font-size:12px;color:#687d6c}.image-card{position:relative;overflow:hidden;border-radius:18px;background:#e6eae4;cursor:pointer}.image-card img{width:100%;height:100%;object-fit:cover;display:block}.image-card .coverlabel{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#102222c9);color:white;padding:58px 20px 20px;font-weight:600}.image-card.inline-playing{background:#111}.image-card.inline-playing video{display:block;width:100%;height:100%;object-fit:cover}.image-card .play{position:absolute;top:16px;right:16px;background:#ffffffdb;color:#2f3d38;padding:10px 14px;border-radius:30px;font-size:12px}.story-head{display:flex;justify-content:space-between;align-items:end;margin:0 0 25px}.story-head h2{font-size:39px;font-family:Georgia,"Songti SC",serif;font-weight:500;margin:6px 0}.story-head p{color:#819089;font-size:14px}.story-content{background:#fff;border:1px solid #e5ebe4;border-radius:24px;padding:32px}.photo-layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}.photo-layout .image-card{height:420px}.note{border-radius:17px;padding:22px;background:#f5f7f1;color:#68776b;line-height:2;font-size:14px}.tag{font-size:11px;letter-spacing:.16em;color:#92a795}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{background:#f8faf5;border:1px solid #e4ebe1;padding:23px;border-radius:19px;min-height:182px;text-align:left}.tile:hover{background:#eaf2e4}.tile strong{display:block;font-size:18px;margin:11px 0}.tile small{color:#7d8c80;line-height:1.8}.tile .emoji{font-size:30px}.footerlinks{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:25px}.ghost{background:white;border:1px solid #dce8dc;color:#536d56;padding:13px 19px;border-radius:50px}.modal{position:fixed;inset:0;background:#0e1919da;display:none;align-items:center;justify-content:center;z-index:9;padding:25px}.modal.show{display:flex}.modal-inner{max-width:min(100%,850px);max-height:95vh;position:relative;display:flex;flex-direction:column;gap:10px}.modal video{max-width:100%;max-height:83vh;border-radius:15px;background:#111}.close{position:absolute;right:-10px;top:-12px;border:0;border-radius:50%;width:35px;height:35px;background:#fff;color:#222}.modal-caption{color:#fff;text-align:center;font-size:13px}.helper{color:#9baaa3;font-size:12px;line-height:1.8}.hidden{display:none!important}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:15px 19px;gap:13px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidebar .side-label,.sidebar .small-card,.sidebar .spacer{display:none}.main{padding:16px}.hero{min-height:620px}.scene-grid{grid-template-columns:1fr}.scene-art{min-height:350px}.scene-panel{padding:31px}.photo-layout{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}@media(max-width:600px){.hero{min-height:585px;padding:26px}.hero h1{font-size:43px;margin-top:60px}.hero-bottom{flex-direction:column;align-items:start}.scene-art{min-height:310px}.tiles{grid-template-columns:1fr}.story-head h2{font-size:29px}.story-content{padding:17px}.photo-layout .image-card{height:340px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><span class="logo-mark">L.</span><div>伦敦生活模拟器<div class="sub">A YEAR ABROAD · UCL</div></div></div><div><div class="side-label">EXPLORE / 探索章节</div><nav class="nav" id="nav"></nav></div><div class="spacer"></div><div class="small-card">🌿 这一年真正的日常：读文献、改论文、每周见导师，以及努力走到学校。<div style="margin-top:14px;display:flex;justify-content:space-between"><span>剧情探索</span><b id="progressText">0 / 6</b></div><div class="progress"><div id="progressBar" style="width:0%"></div></div></div></aside><main class="main"><div class="topline"><span>2025.11 — 2026.11 · LONDON, UK</span><button id="restart">↻ 重新开始</button></div><div class="view" id="content"></div></main></div><script>
// 可替换照片与故事的集中配置：只需把照片放进 assets 文件夹，然后填写 image 路径。
const ASSETS={advisor:'assets/advisor.jpg',advisorLive:'assets/advisor-live.mp4',edinburgh:'assets/edinburgh.jpg',home:null,commute:null,crossing:null,coffee:null,desk:null,london:null,food:null,la:null,italy:null};
const scenes=[
{id:'wake',time:'08:00',title:'新的一天，开始了。',desc:'闹钟响了。外面是伦敦的天气，今天要去 UCL。想到还要走半小时，你决定……',emoji:'🛌',image:'home',label:'THE MORNING / 英国博士生的一天',choices:[{t:'挣扎着起床，出门上学',r:'很好。今天也是认真上学的一天。（至少现在是。）',next:'walk'},{t:'再躺五分钟，思考人生',r:'五分钟后，你发现论文没有自己写完。最后还是起床了。',next:'walk'}]},
{id:'walk',time:'08:30',title:'步行半小时，才算正式上学。',desc:'从家到学校大概要走 30 分钟。换算成大家熟悉的距离，差不多相当于从玉湖走到基础图书馆。',emoji:'🚶🏻‍♀️',image:'commute',label:'THE WALK / 每日远征',choices:[{t:'出发！用双脚丈量伦敦',r:'半小时的城市步行，现在开始。',next:'cross'},{t:'先看看有没有什么捷径',r:'路线研究了一圈，今天还是老老实实走吧。',next:'cross'}]},
{id:'cross',time:'08:45',title:'今日挑战：过马路。',desc:'经过 Euston Station 一带，我每天都得认真观察车流和路况。这里先留一个真实路口的照片位。',emoji:'🚦',image:'crossing',label:'THE CROSSING / 安全第一',choices:[{t:'观察车辆，确认安全后通过',r:'成功通过！这个小游戏里的通关秘诀就是认真观察、遵守交通规则。',next:'coffee'},{t:'寻找更方便的安全过街位置',r:'绕一点路也没关系，安全到校更重要。',next:'coffee'}]},
{id:'coffee',time:'08:55',title:'走到这里，值得一杯咖啡。',desc:'为了鼓励自己去学校，我会在路上给自己买杯咖啡。一个很小的仪式感，却很有用。',emoji:'☕',image:'coffee',label:'COFFEE BREAK / 今日动力',choices:[{t:'买咖啡，给学习充电 ☕',r:'学习动力 +100，钱包余额 -1。继续前进！',next:'ucl'},{t:'今天先省钱 💸',r:'钱包保住了，打起精神也能继续上学。',next:'ucl'}]},
{id:'ucl',time:'09:00',title:'到 UCL 了。现在真的要学习。',desc:'我在 UCL 工程教育中心访学一年。日常主要是读文献、推进博士研究、参加学术交流，以及每周和外导讨论。',emoji:'📚',image:'desk',label:'UCL / 我的学习日常',choices:[{t:'看看我和外导的合照与实况视频',r:'点击合照，直接在原位置播放实况视频。',action:'video'},{t:'今天先去看看伦敦生活',r:'研究之外，伦敦也有很多值得记录的小事。',next:'london'}]},
{id:'london',time:'AFTER HOURS',title:'离开工位以后，伦敦又是另一种生活。',desc:'和室友去吃中餐、尝尝自贡菜、在伦敦 City Walk……这部分后续放你的真实生活照片。',emoji:'🥢',image:'london',label:'OFF DUTY / 下班以后',choices:[{t:'看看英格兰和苏格兰有什么不同',r:'旅行支线已开启，先去爱丁堡。',next:'edinburgh'},{t:'先打开这一年的旅行箱',r:'从英国到美国，再到欧洲大陆。',next:'travel'}]},
];
const ids=['intro','day','ucl','london','edinburgh','travel'],labels=['故事首页','我的一天','UCL 学习','伦敦日常','苏格兰旅行','旅行箱'];const visited=new Set();let page='intro',scene=0,answer=null;
function imgMarkup(name,extra=''){let p=ASSETS[name];return p?`<img src="${p}" alt="${extra||'旅行照片'}">`:`<div class="scene-placeholder"><div class="emoji">${extra||'📷'}</div><div class="missing">📎 这里等待你的真实照片 · ${name}.jpg</div></div>`}
function nav(){document.getElementById('nav').innerHTML=ids.map((id,i)=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="number">0${i+1}</span>${labels[i]}${visited.has(id)?' ✓':''}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('progressText').textContent=`${visited.size} / 6`;document.getElementById('progressBar').style.width=`${visited.size/6*100}%`}
function go(id){page=id;visited.add(id);answer=null;if(id==='day')scene=0;if(id==='ucl')scene=4;if(id==='london')scene=5;render();window.scrollTo({top:0,behavior:'smooth'})}
function openVideo(){
 const card=document.getElementById('heroLive');
 if(!card)return;
 const existing=card.querySelector('video');
 if(existing){if(existing.paused){existing.play().catch(()=>{});}else{existing.pause();}return;}
 card.classList.add('inline-playing');
 card.innerHTML=`<video id="liveVideo" src="${ASSETS.advisorLive}" poster="${ASSETS.advisor}" playsinline controls preload="auto" aria-label="与外导的实况照片"></video>`;
 const video=card.querySelector('video');
 video.addEventListener('click',e=>e.stopPropagation());
 video.addEventListener('ended',()=>{
   card.classList.remove('inline-playing');
   card.innerHTML=`<img src="${ASSETS.advisor}" alt="与外导的合照"><span class="play">◉ LIVE · 点击播放</span>`;
 });
 video.play().catch(()=>{});
 visited.add('ucl');nav();
}
function render(){nav();let el=document.getElementById('content');if(page==='intro'){el.innerHTML=`<section class="hero"><div class="eyebrow">✳ INTERACTIVE TRAVEL DIARY · 2025—2026</div><h1>这一年，<br>我在<em>伦敦</em>干了些什么？</h1><p>一个博士生的上学、咖啡、导师会谈和到处乱跑。<br>不是正式的留学报告，而是一场可以亲自选择的真实生活体验。</p><div class="hero-bottom"><div class="hero-sticker"><div class="big">365 days (roughly) in London ☕</div><small>LEARNING · LIVING · GETTING LOST · EXPLORING</small></div><button class="primary" id="start">开始体验我的一天 ↗</button></div></section>`;document.getElementById('start').onclick=()=>go('day');return}
if(['day','ucl','london'].includes(page)){let s=scenes[scene];if(page==='ucl')s=scenes[4];if(page==='london')s=scenes[5];let visual=s.image==='desk'?`<div class="image-card" style="position:absolute;inset:0;border-radius:0" id="heroLive"><img src="${ASSETS.advisor}" alt="与外导的合照"><span class="play">◉ LIVE · 点击播放</span></div>`:imgMarkup(s.image,s.emoji);el.innerHTML=`<div class="scene-grid"><div class="scene-art">${visual}${s.image==='desk'?'':`<div class="shade"></div><div class="artlabel"><small>${s.label}</small><strong>${s.time}</strong></div>`}</div><div class="scene-panel"><div class="kicker">CHAPTER / ${String(scene+1).padStart(2,'0')} · ${s.time}</div><h2>${s.title}</h2><p>${s.desc}</p><div class="quote">${s.image==='desk'?'📸 这张合照已接入真实的 2.75 秒 Live Photo。点击左侧照片将在当前照片位置播放，不会弹出窗口。':'✦ 这是故事原型。选项是交互体验，具体场景细节可以继续按你的真实经历调整。'}</div><div class="choices">${answer===null?s.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c.t}<span>↗</span></button>`).join(''):`<div class="response">${answer.r}</div><button class="primary" id="continue">${answer.action==='video'?'播放实况照片 ▶':'继续这个故事 →'}</button>`}</div><button class="back" id="prev">← 返回上一段 / 返回首页</button></div></div>`;let heroLive=document.getElementById('heroLive');if(heroLive)heroLive.onclick=openVideo;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answer=s.choices[Number(b.dataset.choice)];render()});let c=document.getElementById('continue');if(c)c.onclick=()=>{if(answer.action==='video'){openVideo();return}let next=answer.next;if(next==='edinburgh'||next==='travel'){go(next);return}if(next==='london'){go('london');return}let idx=scenes.findIndex(x=>x.id===next);if(idx>=0){page='day';scene=idx;answer=null;render()}else go('travel')};document.getElementById('prev').onclick=()=>{if(page==='day'&&scene>0){scene--;answer=null;render()}else go('intro')};return}
if(page==='edinburgh'){el.innerHTML=`<div class="story-head"><div><div class="tag">04 / THE UK, BEYOND LONDON</div><h2>英国不只有伦敦。</h2><p>英格兰与苏格兰，是两种不同的旅行感受。</p></div><span class="pill">📍 Edinburgh</span></div><div class="story-content"><div class="photo-layout"><div class="image-card" style="height:540px"><img src="${ASSETS.edinburgh}" alt="你拍摄的爱丁堡 Calton Hill Nelson Monument 照片"><div class="coverlabel">爱丁堡 · Calton Hill<br><small>你提供的原始旅行照片</small></div></div><div style="display:flex;flex-direction:column;gap:16px"><div class="tag">A PHOTO, A MEMORY</div><h2 style="font-family:Georgia,'Songti SC',serif;font-weight:500;font-size:36px;margin:0">我觉得最好看的风景，在爱丁堡。</h2><p style="color:#718078;line-height:2;font-size:15px">你提供的照片里，山坡上有人休息、有人拍照，背后是高耸的纪念塔。和伦敦的街道相比，这里呈现出另一种城市与自然交织的感觉。</p><div class="note">✦ 以后可以为这张照片加上一个互动问题：<br><b>“你猜，我更喜欢伦敦还是爱丁堡？”</b><br>让听众选完再揭晓你的真实答案。</div><button class="primary" id="nextTravel">继续打开旅行箱 ↗</button></div></div></div>`;document.getElementById('nextTravel').onclick=()=>go('travel');return}
if(page==='travel'){el.innerHTML=`<div class="story-head"><div><div class="tag">05 / THE WORLD OUTSIDE LONDON</div><h2>以学术的名义，去看看世界。</h2><p>会议、旅行、赶车与计划之外的故事。</p></div><span class="pill">🧳 Travel memories</span></div><div class="story-content"><div class="tiles"><button class="tile" data-trip="la"><div class="emoji">🌴</div><strong>洛杉矶 · 美国</strong><small>AERA 2026 学术会议，也是一次不同于英国的城市体验。<br>等待会议与旅途照片。</small></button><button class="tile" data-trip="italy"><div class="emoji">🚆</div><strong>意大利 · 计划之外</strong><small>赶车、改行程、路上的意外，可能比景点更值得回忆。<br>等待旅途照片。</small></button><button class="tile" data-trip="others"><div class="emoji">🗺️</div><strong>西班牙 / 法国</strong><small>照片和具体路线以后再慢慢填充。<br>点击看看预留的故事入口。</small></button></div><div id="tripDetail" class="note" style="margin-top:23px">选一个目的地，解锁一张旅行故事卡。后续补素材时，可以在这里加入“原计划 → 发生意外 → 最后的故事”的分支互动。</div><div class="footerlinks"><button class="ghost" id="backEd">← 回到爱丁堡</button><button class="primary" id="endStory">回到故事开头 ↗</button></div></div>`;document.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{let data={la:'🌴 洛杉矶支线：从 AERA 会议现场开始，转入你最想分享的美国见闻。这里会放会议照片、城市照片和一个“你猜美国和英国哪里最不一样？”的选择题。',italy:'🚆 意大利支线：不按景点排列，而是按旅途转折展开。比如：原本要去哪里？中途发生了什么？最后意外遇见了什么？',others:'🗺️ 欧洲支线：可按城市、同行的人或某个难忘的片段展开。当前不编造你去过的具体城市。'};document.getElementById('tripDetail').textContent=data[b.dataset.trip]});document.getElementById('backEd').onclick=()=>go('edinburgh');document.getElementById('endStory').onclick=()=>go('intro');return}}
document.getElementById('restart').onclick=()=>{visited.clear();scene=0;answer=null;go('intro')};render();
</script></body></html>
